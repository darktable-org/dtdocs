{{- /* Language switcher. Context: (dict "Page" . "Dropup" bool) */ -}}
{{- $page := .Page -}}
{{- if $page.IsTranslated }}
<div class="dt-switcher {{ if .Dropup }}dropup{{ else }}dropdown{{ end }}">
  <button
    class="dt-switcher__toggle dropdown-toggle"
    type="button"
    data-toggle="dropdown"
    aria-expanded="false"
    aria-label="{{ i18n "languages" | default "languages" }}: {{ $page.Site.Language.LanguageName }}"
  >
    <i class="fa fa-globe" aria-hidden="true"></i>
    <span>{{ $page.Site.Language.LanguageName }}</span>
  </button>
  <div class="dropdown-menu dropdown-menu-right">
    <a
      class="dropdown-item"
      aria-current="true"
      hreflang="{{ $page.Site.Language.Lang }}"
      lang="{{ $page.Site.Language.Lang }}"
      href="{{ $page.Permalink }}"
      >{{ $page.Site.Language.LanguageName }}</a
    >
    {{ range (sort $page.Translations ".Language.LanguageName") }}
      <a
        class="dropdown-item"
        hreflang="{{ .Language.Lang }}"
        lang="{{ .Language.Lang }}"
        href="{{ .Permalink }}"
        >{{ .Language.LanguageName }}</a
      >
    {{ end }}
  </div>
</div>
{{- end }}
